<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>h3 number analysis tool</h3>
    <script>
        let number=7;
        if(number>=0)
        {
            console.log("Positive");
        }
        else
        {
            console.log("Negative");
        }
        if(number%2==0)
        {
            console.log("number is even");
        }
        else
        {
            console.log("number is odd");
        }
        console.log("printing 1 to given numbers");
        for(let i=1;i<=number;i++)
        {
            console.log(i);
        }
    </script>
</body>
</html>
