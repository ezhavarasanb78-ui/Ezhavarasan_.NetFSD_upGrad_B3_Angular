<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}


.dashboard {
    display: flex;
    min-height: 100vh;
}



.sidebar {
    background-color: #1e293b;
    color: white;
    padding: 20px;
    flex: 1 1 20%;
}

.sidebar h2 {
    margin-top: 0;
}

.sidebar nav {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.sidebar nav a {
    text-decoration: none;
    color: white;
    padding: 8px;
    border-radius: 4px;
}

.sidebar nav a:hover {
    background-color: #334155;
}



.main-content {
    flex: 1 1 80%;
    background-color: #f1f5f9;
    padding: 20px;
}

.card-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 20px;
}


.card {
    background-color: white;
    border: 1px solid #ccc;
    padding: 20px;
    flex: 1 1 45%;
    border-radius: 8px;
}



@media (max-width: 900px) {
    .card {
        flex: 1 1 100%;
    }
}

@media (max-width: 600px) {

    .dashboard {
        flex-direction: column;
    }

    .sidebar {
        flex: none;
        display: flex;
        
        align-items: center;
    }

    .sidebar nav {
        flex-direction: row;
        gap: 15px;
    }

    .main-content {
        padding: 15px;
    }
}

</style>
<body>
    <div class="dashboard">

        <aside class="sidebar">
            <h2>Admin Panel</h2>
            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Users</a>
                <a href="#">Reports</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <main class="main-content">
            <h1>Dashboard Overview</h1>

            <div class="card-container">
                <div class="card">
                    <h3>Total Users</h3>
                    <p>1,250</p>
                </div>

                <div class="card">
                    <h3>Sales</h3>
                    <p>$8,540</p>
                </div>

                <div class="card">
                    <h3>New Orders</h3>
                    <p>320</p>
                </div>

                <div class="card">
                    <h3>Support Tickets</h3>
                    <p>24</p>
                </div>
            </div>

        </main>

    </div>
</body>
</html>
