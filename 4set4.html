<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Traffic signal </h3>
    <input id="check">
    <button onclick="cs()">check</button>
    <script>
        function cs()
        {
            let signal=document.getElementById("check").value;
            switch(signal)
            {
              case "red":
                console.log("stop");
                break;
              case "yellow":
                console.log("Get ready");
                break;
              case "Green":
                console.log("Go");
                break;
             }
        }
    </script>
</body>
</html>
