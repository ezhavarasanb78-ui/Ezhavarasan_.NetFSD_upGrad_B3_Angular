<!DOCTYPE html>
<html>
<head>
    <title>Employee Filter</title>
</head>
<body>

<h2>Employee Job Filter</h2>

<select id="jobSelect">
    <option value="All">All Employees</option>
    <option value="Manager">Manager</option>
    <option value="Salesman">Salesman</option>
    <option value="Developer">Developer</option>
</select>

<button onclick="showEmployees()">Show Emps</button>

<table id="empTable" border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Job</th>
            <th>Salary</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script>

const employees = [
    { id: 1, name: "Ravi", job: "Manager", salary: 60000 },
    { id: 2, name: "Priya", job: "Salesman", salary: 30000 },
    { id: 3, name: "Arun", job: "Developer", salary: 45000 },
    { id: 4, name: "Meena", job: "Manager", salary: 65000 },
    { id: 5, name: "Karthik", job: "Salesman", salary: 32000 }
];

function showEmployees() {

    const selectedJob = document.getElementById("jobSelect").value;
    const tableBody = document.querySelector("#empTable tbody");

    tableBody.innerHTML = "";

    const filteredEmployees = selectedJob === "All"
        ? employees
        : employees.filter(emp => emp.job === selectedJob);

    filteredEmployees.forEach(emp => {
        const row = `
            <tr>
                <td>${emp.id}</td>
                <td>${emp.name}</td>
                <td>${emp.job}</td>
                <td>${emp.salary}</td>
            </tr>
        `;
        tableBody.innerHTML += row;
    });
}

</script>

</body>
</html>
