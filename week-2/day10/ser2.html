<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopLite</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
<div class="container">
<a class="navbar-brand" href="#">ShopLite</a>
<button class="navbar-toggler" data-bs-toggle="offcanvas" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span></button>
<div class="offcanvas offcanvas-end" id="menu">
<div class="offcanvas-header">
<h5>Menu</h5><button class="btn-close" data-bs-dismiss="offcanvas"></button>
</div>
<div class="offcanvas-body">
<a class="nav-link" href="#">Home</a>
<a class="nav-link" href="#">Products</a>
<a class="nav-link" href="#">Contact</a>
</div></div></div></nav>
<section class="hero text-center">
<div class="container">
<h1>Big Sale 50% OFF</h1>
<p>Best deals on top products</p>
<button class="btn btn-light">Shop Now</button>
</div></section>
<div class="container my-4">
<div id="c" class="carousel slide" data-bs-ride="carousel">
<div class="carousel-inner text-center">
<div class="carousel-item active"><img src="https://picsum.photos/300?1" class="d-block mx-auto rounded"><h5 class="mt-2">Watch</h5></div>
<div class="carousel-item"><img src="https://picsum.photos/300?2" class="d-block mx-auto rounded"><h5 class="mt-2">Headphones</h5></div>
<div class="carousel-item"><img src="https://picsum.photos/300?3" class="d-block mx-auto rounded"><h5 class="mt-2">Shoes</h5></div>
</div>
<button class="carousel-control-prev" data-bs-target="#c" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
<button class="carousel-control-next" data-bs-target="#c" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
</div></div>
<div class="container my-4">
<div class="row g-3">
<div class="col-sm-6 col-md-4"><div class="card text-center"><img src="https://picsum.photos/200?4"><div class="card-body"><h6>Product 1</h6></div></div></div>
<div class="col-sm-6 col-md-4"><div class="card text-center"><img src="https://picsum.photos/200?5"><div class="card-body"><h6>Product 2</h6></div></div></div>
<div class="col-sm-6 col-md-4"><div class="card text-center"><img src="https://picsum.photos/200?6"><div class="card-body"><h6>Product 3</h6></div></div></div>
</div></div>
<section class="bg-primary text-white text-center p-4">
<h5>Subscribe</h5>
<form class="row g-2 justify-content-center">
<div class="col-md-4"><input type="email" class="form-control" placeholder="Email"></div>
<div class="col-auto"><button class="btn btn-light">Submit</button></div>
</form>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
