<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>College Events</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="#">Event Dashboard</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item">
          <button class="btn btn-light ms-lg-3" data-bs-toggle="modal" data-bs-target="#eventModal">
            Add Event
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>
<div class="container my-4">
  <div class="row g-3">
    <div class="col-sm-12 col-md-6 col-lg-4">
      <div class="card shadow-sm"><div class="card-body">
        <h5>Tech Fest</h5><p>Date: 10 Apr</p>
      </div></div>
    </div>
    <div class="col-sm-12 col-md-6 col-lg-4">
      <div class="card shadow-sm"><div class="card-body">
        <h5>Cultural Day</h5><p>Date: 15 Apr</p>
      </div></div>
    </div>
    <div class="col-sm-12 col-md-6 col-lg-4">
      <div class="card shadow-sm"><div class="card-body">
        <h5>Sports Meet</h5><p>Date: 20 Apr</p>
      </div></div>
    </div>
  </div>
</div>
<div class="modal fade" id="eventModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Add Event</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form class="needs-validation" novalidate>
          <input class="form-control mb-2" placeholder="Event Name" required>
          <input type="date" class="form-control mb-2" required>
          <input class="form-control mb-2" placeholder="Location" required>
          <button class="btn btn-primary w-100" type="submit">Save</button>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
(()=>{const f=document.querySelector("form");
f.addEventListener("submit",e=>{
if(!f.checkValidity()){e.preventDefault();e.stopPropagation();}
f.classList.add("was-validated");
});})();
</script>

</body>
</html>
