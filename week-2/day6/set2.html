<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Form validation</h3>
    <form>
        <label>Name :</label>
        <input type="text",id="name" onchange="name()">
        <p id="nm"></p>
         <label>email :</label>
        <input type="email" id="email" onchange="email()">
        <p id="em"></p>
         <label>age :</label>
        <input type="number",id="age" onchange="age()">
        <p id="am"></p>
        <br><br>
        <button onclick="submit()">submit</button>
    </form>
    <script>
        function name()
        {
              let name = document.getElementById("name").value;

               if (name.trim() === "") 
               {
                    document.getElementById("nm").innerText = "Name cannot be empty";
                    return false;
                } 
               else
              {
               document.getElementById("nm").innerText = "Valid Name";
               return true;
              }
        }
        function email()
        {
               let email = document.getElementById("email").value;

              if (email.includes("@")) 
              {
                document.getElementById("em").innerText = "Valid Email";
                return true;
              } 
              else 
              {
                 document.getElementById("em").innerText = "Email must contain @";
                 return false;
              }
        }
        function age()
        {
                let age = document.getElementById("age").value;

              if (age > 18) 
              {
                 document.getElementById("am").innerText = "Valid Age";
                 return true;
              }
           else
            {
                 document.getElementById("am").innerText = "Age must be greater than 18";
                return false;
            }
        }
        function submit()
        {
            let Name = name();
            let Email=email();
            let Age=age();
            if (Name && Email && Age)
             {

                  let userData = {
                        name: document.getElementById("name").value,
                        email: document.getElementById("email").value,
                       age: document.getElementById("age").value
                    };

                sessionStorage.setItem("user", JSON.stringify(userData));

               document.getElementById("finalMsg").innerText = 
              "Registration Successful! Data stored in sessionStorage.";
             } 
            else 
            {
              document.getElementById("finalMsg").innerText = 
              "Please fix errors before submitting.";
            }
        }
    </script>
</body>
</html>
