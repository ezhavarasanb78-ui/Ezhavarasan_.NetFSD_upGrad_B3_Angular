<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>user Information displaying</h3>
    <button onclick="show()">Display</button>
    <p id="name"></p>
    <p id="age"></p>
    <p id="city"></p>
    <script>
        function show()
        {
            var user={
                name: "Ezhavarasan B",
                Age: 22,
                city: "Chennai"
            };
            display(user);
        }
        function display(user)
        {
            document.getElementById("name").innerHTML="name "+ user.name;
            document.getElementById("age").innerHTML="age "+ user.Age;
            document.getElementById("city").innerHTML="city "+ user.city;
        }
    </script>
</body>
</html>
