<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <title>Document</title>
</head>
<body>
    <h3>Student feedbackform</h3>
    <form id="form">
        <label>Name :</label>
        <input type="text" id="n">
        <label>Email :</label>
        <input type="email" id="e">
        <label>Rating :</label>
        <select id="r">
            <option value="">select</option>
            <option>Excellent</option>
            <option>Good</option>
            <option>Average</option>
            <option>Poor</option>
        </select>
        <label>Comment :</label>
        <textarea id="c"></textarea>
        <button id="btn" type="button">submit</button>
    </form>
    <p id="res"></p>
    <script>
        $(document).ready(function()
        {
            $("#btn").click(function()
            {
                var n=$("#n").val();
                var e=$("#e").val();
                if(n==""|| e=="")
                {
                    $("#res").text("enter the name and email").css("color","red");
                }
                else
                {
                    $("#res").text("Thanks for Your Feedback !").css("color","green");
                     $("#form")[0].reset();
                }
               
            });
        });
    </script>
</body>
</html>
